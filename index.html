<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Sana Bir Şey Soracağım ❤️</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #11162d;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wrap {
  width: min(92vw, 520px);
  text-align: center;
  position: relative;
}

h1 {
  color: #ff4778;
  font-size: clamp(30px, 9vw, 48px);
  margin: 0 0 25px;
  text-shadow: 0 0 16px rgba(255,79,120,.35);
}

.photo {
  width: 100%;
  max-width: 320px;
  height: 360px;
  object-fit: cover;
  border-radius: 20px;
  margin: 15px auto 25px;
  display: block;
  box-shadow: 0 0 25px rgba(255,79,120,.4);
}

.music-btn {
  margin-top: 5px;
  padding: 14px 25px;
  border: 0;
  border-radius: 999px;
  background: #ff3f68;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.question {
  margin-top: 20px;
}

.yes {
  width: 100%;
  height: 150px;
  border: 0;
  border-radius: 18px;
  background: #20b84b;
  color: #fff;
  font-size: clamp(34px, 10vw, 56px);
  font-weight: 700;
  box-shadow: 0 10px 25px rgba(0,0,0,.25);
  cursor: pointer;
}

.no {
  position: fixed;
  border: 0;
  border-radius: 999px;
  background: #ef3f55;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  padding: 8px 14px;
  cursor: pointer;
  z-index: 5;
  transition: left .12s ease, top .12s ease;
}

.heart {
  font-size: 70px;
  animation: pulse 1s infinite;
}

.final {
  margin-top: 18px;
}

.restart {
  margin-top: 12px;
  padding: 12px 22px;
  border: 0;
  border-radius: 12px;
  background: #ff4778;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.hidden {
  display: none;
}

@keyframes pulse {
  50% {
    transform: scale(1.12);
  }
}
</style>
</head>

<body>

<div class="wrap" id="main">

  <!-- FOTOĞRAF -->
  <img class="photo" src="Sude.jpg" alt="Sude">

  <!-- MÜZİK -->
  <button class="music-btn" id="musicBtn">
    🎵 Müziği Aç
  </button>

  <audio id="music" loop>
    <source src="Intizar-Nazar-Boncugum.mp3" type="audio/mpeg">
  </audio>

  <!-- SORU -->
  <h1 class="question" id="question">
    Beni affettin mi aşkım? ❤️
  </h1>

  <button class="yes" id="yes">
    EVET ❤️
  </button>

</div>

<!-- HAYIR BUTONU -->
<button class="no" id="no">
  Hayır
</button>

<!-- SON EKRAN -->
<div class="wrap final hidden" id="final">

  <div class="heart">❤️</div>

  <h1>İşte bunu duymak istiyordum! ❤️</h1>

  <p>
    Seni çok seviyorum aşkım.<br>
    İyi ki varsın, iyi ki benimsin. 🥹❤️
  </p>

  <button class="restart" onclick="location.reload()">
    Başa dön
  </button>

</div>

<script>

const no = document.getElementById("no");
const yes = document.getElementById("yes");
const main = document.getElementById("main");
const final = document.getElementById("final");

const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

/* MÜZİĞİ AÇ / KAPAT */
musicBtn.addEventListener("click", function () {

  if (music.paused) {
    music.play();

    musicBtn.innerHTML = "⏸️ Müziği Durdur";
  } else {
    music.pause();

    musicBtn.innerHTML = "🎵 Müziği Aç";
  }

});

/* EVET'E BASINCA MÜZİK BAŞLASIN */
yes.addEventListener("click", function () {

  music.play().catch(() => {});

  main.classList.add("hidden");
  no.classList.add("hidden");
  final.classList.remove("hidden");

});

/* HAYIR BUTONU KAÇSIN */
function moveNo() {

  const padding = 20;

  const maxX = window.innerWidth - no.offsetWidth - padding;
  const maxY = window.innerHeight - no.offsetHeight - padding;

  const x = Math.random() * maxX + padding;
  const y = Math.random() * maxY + padding;

  no.style.left = x + "px";
  no.style.top = y + "px";
}

/* TELEFONDA DOKUNUNCA KAÇSIN */
no.addEventListener("touchstart", function(e) {

  e.preventDefault();
  moveNo();

});

/* BİLGİSAYARDA ÜZERİNE GELİNCE KAÇSIN */
no.addEventListener("mouseenter", function() {

  moveNo();

});

/* SAYFA AÇILINCA HAYIR BUTONUNU YERLEŞTİR */
moveNo();

</script>

</body>
</html>
