<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sana Bir Şey Soracağım ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #11162d;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wrap {
  width: 92%;
  max-width: 520px;
  text-align: center;
}

h1 {
  color: #ff4778;
  font-size: 35px;
}

.photo {
  width: 100%;
  max-width: 320px;
  height: 360px;
  object-fit: cover;
  border-radius: 20px;
  display: block;
  margin: 20px auto;
  box-shadow: 0 0 25px rgba(255,79,120,.4);
}

.music-btn {
  padding: 16px 28px;
  border: none;
  border-radius: 50px;
  background: #ff4778;
  color: white;
  font-size: 18px;
  font-weight: bold;
  margin: 10px;
}

.yes {
  width: 100%;
  height: 150px;
  border: none;
  border-radius: 18px;
  background: #20b84b;
  color: white;
  font-size: 45px;
  font-weight: bold;
  margin-top: 20px;
}

.no {
  position: fixed;
  border: none;
  border-radius: 50px;
  background: #ef3f55;
  color: white;
  padding: 10px 18px;
  font-weight: bold;
}

.hidden {
  display: none;
}

.heart {
  font-size: 80px;
}
</style>
</head>

<body>

<div class="wrap" id="main">

  <h1>Beni affettin mi aşkım? ❤️</h1>

  <!-- FOTOĞRAF -->
  <img src="Sude.jpg" class="photo" alt="Sude">

  <!-- MÜZİK -->
  <button class="music-btn" id="musicBtn">
    🎵 MÜZİĞİ AÇ
  </button>

  <audio id="music" loop>
    <source
      src="https://husx1m.github.io/Askim-site/Intizar-Nazar-Boncugum.mp3"
      type="audio/mpeg">
  </audio>

  <button class="yes" id="yes">
    EVET ❤️
  </button>

</div>

<button class="no" id="no">
  Hayır
</button>

<div class="wrap hidden" id="final">

  <div class="heart">❤️</div>

  <h1>İşte bunu duymak istiyordum! ❤️</h1>

  <p>
    Seni çok seviyorum aşkım.<br>
    İyi ki varsın, iyi ki benimsin. 🥹❤️
  </p>

</div>

<script>

const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click", async function() {

  try {

    if (music.paused) {
      await music.play();
      musicBtn.innerHTML = "⏸️ MÜZİĞİ DURDUR";
    } else {
      music.pause();
      musicBtn.innerHTML = "🎵 MÜZİĞİ AÇ";
    }

  } catch (error) {

    alert("Müzik yüklenemedi. Birkaç saniye bekleyip tekrar dene.");

  }

});


const no = document.getElementById("no");

function moveNo() {

  const x = Math.random() *
    (window.innerWidth - no.offsetWidth - 20) + 10;

  const y = Math.random() *
    (window.innerHeight - no.offsetHeight - 20) + 10;

  no.style.left = x + "px";
  no.style.top = y + "px";
}

no.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNo();
});

no.addEventListener("mouseenter", moveNo);

moveNo();


const yes = document.getElementById("yes");
const main = document.getElementById("main");
const final = document.getElementById("final");

yes.addEventListener("click", function() {

  music.play().catch(() => {});

  main.classList.add("hidden");
  no.classList.add("hidden");
  final.classList.remove("hidden");

});

</script>

</body>
</html>
