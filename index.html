<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sana Bir Şey Soracağım ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#11162d;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
}
.wrap{width:min(92vw,520px);text-align:center;position:relative}
h1{
  color:#ff4f78;
  font-size:clamp(30px,9vw,48px);
  margin:0 0 55px;
  text-shadow:0 0 16px rgba(255,79,120,.35);
}
.yes{
  width:100%;
  height:150px;
  border:0;
  border-radius:18px;
  background:#20b84b;
  color:#fff;
  font-size:clamp(34px,10vw,56px);
  font-weight:700;
  box-shadow:0 10px 25px rgba(0,0,0,.25);
  cursor:pointer;
}
.no{
  position:fixed;
  border:0;
  border-radius:999px;
  background:#ef3f55;
  color:#fff;
  font-weight:700;
  font-size:16px;
  padding:8px 14px;
  cursor:pointer;
  z-index:5;
  transition:left .12s ease,top .12s ease;
}
.heart{font-size:70px;animation:pulse 1s infinite}
.final h1{margin-bottom:18px}
.final p{font-size:22px;line-height:1.5;margin:0}
.restart{margin-top:28px;padding:12px 22px;border:0;border-radius:12px;font-size:17px}
@keyframes pulse{50%{transform:scale(1.12)}}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="main">
  <h1 id="question">Beni affettin mi aşkım? ❤️</h1>
  <button class="yes" id="yes">Evet</button>
</div>

<button class="no" id="no">Hayır</button>

<div class="wrap final hidden" id="final">
  <div class="heart">❤️</div>
  <h1>İşte bunu duymak istiyordum!</h1>
  <p>Seni çok seviyorum aşkım.<br>İyi ki varsın, iyi ki benimlesin. 🥹❤️</p>
  <button class="restart" onclick="location.reload()">Başa dön</button>
</div>

<script>
const no = document.getElementById('no');
const yes = document.getElementById('yes');
const main = document.getElementById('main');
const final = document.getElementById('final');
const question = document.getElementById('question');

let attempts = 0;

function moveNo(){
  const pad = 12;
  const w = no.offsetWidth, h = no.offsetHeight;
  const x = pad + Math.random() * Math.max(1, innerWidth-w-pad*2);
  const y = pad + Math.random() * Math.max(1, innerHeight-h-pad*2);
  no.style.left = x + 'px';
  no.style.top = y + 'px';
  attempts++;
  if(attempts === 2) question.textContent = "Emin misin? 🥺";
  if(attempts === 4) question.textContent = "Lütfeeeen? 🥹❤️";
  if(attempts === 7) question.textContent = "Hayır diye bir seçenek yok ki 😭";
}
no.addEventListener('mouseenter', moveNo);
no.addEventListener('touchstart', e => { e.preventDefault(); moveNo(); }, {passive:false});
no.addEventListener('click', moveNo);

function placeNo(){
  no.style.left = (innerWidth - no.offsetWidth - 55) + 'px';
  no.style.top = (innerHeight/2 + 75) + 'px';
}
addEventListener('resize', placeNo);
placeNo();

yes.addEventListener('click', ()=>{
  main.classList.add('hidden');
  no.classList.add('hidden');
  final.classList.remove('hidden');
});
</script>
</body>
</html>
